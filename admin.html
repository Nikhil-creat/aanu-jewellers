<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>AANU Admin</title>
<style>body{font:14px system-ui,sans-serif;margin:0;background:#141210;color:#f3ede0}main{max-width:920px;margin:auto;padding:16px}h1,h2{font-family:Georgia,serif;color:#E6C57A;margin:.3em 0}input,select,button,textarea{font:inherit;padding:8px;border-radius:8px;border:1px solid #6b5a30;background:#1f1b16;color:inherit;max-width:100%}button{background:#C5A059;color:#111;border:0;cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #3a3226;padding:6px;text-align:left;vertical-align:top}section{margin:16px 0;padding:14px;border:1px solid #3a3226;border-radius:12px;overflow-x:auto}.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}label{font-size:11px;color:#a9a193;display:block}small{color:#a9a193}</style></head><body><main>
<h1>AANU Admin</h1>
<div id="lg"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"> <button id="lb">Login</button> <small id="le"></small></div>
<div id="ap" hidden>
<section><h2>Gold &amp; silver rates (per gram)</h2><div class="g" id="rf"></div>
<p><label><input type="checkbox" id="auto"> Auto-update from live market (needs calibration)</label></p>
<p><button id="rs">Save rates</button> <button id="rr">Refresh now</button> <small id="rm"></small></p>
<p><small>Calibrate once so market data matches your local board:</small><br><input id="c24" type="number" placeholder="Today's 24K per g on your board"> <input id="csv" type="number" placeholder="92.5 silver per g"> <button id="cb">Calibrate</button></p></section>
<section><h2>Orders</h2><div id="ot">Loading...</div></section>
<section><h2>Custom requests</h2><div id="ct"></div></section>
<section><h2>Products</h2><p><input type="file" id="pf" accept=".json"> <label style="display:inline"><input type="checkbox" id="rep"> replace all</label> <button id="pb">Import products.json</button> <small id="pm"></small></p><div id="pt"></div></section>
</div></main>
<script>
var T=sessionStorage.getItem("aanu_t"),$=function(i){return document.getElementById(i)},B="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(p,o){o=o||{};o.headers={"Content-Type":"application/json",Authorization:"Bearer "+T};if(o.body&&typeof o.body!=="string")o.body=JSON.stringify(o.body);return fetch(B+"/api"+p,o).then(function(r){if(r.status===401){sessionStorage.removeItem("aanu_t");location.reload()}return r.json()})}
$("lb").onclick=function(){fetch(B+"/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value})}).then(function(r){return r.json()}).then(function(j){if(j.token){T=j.token;sessionStorage.setItem("aanu_t",T);go()}else $("le").textContent=j.error||"failed"})};
var RK=["gold24","gold22","gold20","gold18","silver","makingGold","makingSilver","gst"];
function go(){$("lg").hidden=true;$("ap").hidden=false;rates();orders();custom();prods()}
function rates(){fetch(B+"/api/rates").then(function(r){return r.json()}).then(function(R){$("rf").innerHTML=RK.map(function(k){return'<div><label>'+k+'</label><input id="r_'+k+'" type="number" step="any" value="'+R[k]+'"></div>'}).join("");$("auto").checked=R.mode==="auto";$("rm").textContent="Last update: "+R.updated})}
$("rs").onclick=function(){var b={mode:$("auto").checked?"auto":"manual"};RK.forEach(function(k){b[k]=$("r_"+k).value});api("/admin/rates",{method:"PUT",body:b}).then(function(){$("rm").textContent="Saved";rates()})};
$("rr").onclick=function(){api("/admin/refresh",{method:"POST"}).then(function(){rates()})};
$("cb").onclick=function(){api("/admin/calibrate",{method:"POST",body:{gold24:$("c24").value,silver:$("csv").value}}).then(function(j){$("rm").textContent=j.ok?"Calibrated. Tick Auto-update and Save.":(j.error||"failed")})};
function orders(){api("/admin/orders").then(function(a){$("ot").innerHTML=Array.isArray(a)&&a.length?'<table><tr><th>Ref / time</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+a.map(function(o){return'<tr><td>'+esc(o.ref)+'<br><small>'+esc(o.rates.placedAt)+'<br>22K '+esc(o.rates.gold22)+'/g</small></td><td>'+esc(o.name)+'<br><a style="color:#E6C57A" href="https://wa.me/91'+esc(o.phone)+'">'+esc(o.phone)+'</a></td><td>'+o.items.map(function(i){return esc(i.name)+" x"+i.qty+(i.size&&i.size!=="Free"?" ("+esc(i.size)+")":"")}).join("<br>")+'</td><td>&#8377; '+Number(o.total).toLocaleString("en-IN")+'</td><td><select data-id="'+o.id+'">'+["new","confirmed","ready","delivered","cancelled"].map(function(s){return'<option'+(s===o.status?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td></tr>'}).join("")+'</table>':"No orders yet.";
 document.querySelectorAll("#ot select").forEach(function(s){s.onchange=function(){api("/admin/orders/"+s.dataset.id,{method:"PATCH",body:{status:s.value}})}})})}
function custom(){api("/admin/custom").then(function(a){$("ct").innerHTML=Array.isArray(a)&&a.length?a.map(function(c){return'<p><b>'+esc(c.name)+'</b> &middot; '+esc(c.metal)+' &middot; '+esc(c.whom)+'<br>'+esc(c.details)+'</p>'}).join(""):"None."})}
function prods(){api("/admin/products").then(function(a){$("pt").innerHTML=Array.isArray(a)?"<small>"+a.length+" products</small><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Weight</th><th>In stock</th><th></th></tr>"+a.slice(0,300).map(function(p){return'<tr><td>'+p.id+'</td><td>'+esc(p.name)+'<br><small>'+esc(p.tags)+' &middot; '+esc(p.style)+'</small></td><td>'+esc(p.type)+'</td><td>'+(+p.gold_g+ +p.silver_g)+' g</td><td><input type="checkbox" data-s="'+p.id+'"'+(p.in_stock?" checked":"")+'></td><td><button data-d="'+p.id+'">x</button></td></tr>'}).join("")+"</table>":"";
 document.querySelectorAll("[data-s]").forEach(function(c){c.onchange=function(){api("/admin/products/"+c.dataset.s,{method:"PATCH",body:{in_stock:c.checked}})}});document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){if(confirm("Delete product "+b.dataset.d+"?"))api("/admin/products/"+b.dataset.d,{method:"DELETE"}).then(prods)}})})}
$("pb").onclick=function(){var f=$("pf").files[0];if(!f)return $("pm").textContent="Choose a products.json first";f.text().then(function(t){return api("/admin/products/bulk",{method:"POST",body:{rows:JSON.parse(t),replace:$("rep").checked}})}).then(function(j){$("pm").textContent=(j.added||0)+" imported";prods()}).catch(function(){$("pm").textContent="Invalid file"})};
if(T)go();
</script></body></html>
